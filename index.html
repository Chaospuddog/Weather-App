<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li><img src="./media/logoBright.svg" alt="Weather app" /></li>
        <li><button class="city" type="button" hidden>Łódź</button></li>
      </ul>
      <div class="citySearchWrapper">
        <button type="button" class="cityMenuButton">AktualneMiasto</button>
        <div class="cityMenu" hidden>
          <input
            type="search"
            class="citySearch"
            placeholder="Funkcja niedokonczona :c"
          />
          <button type="button" class="searchButton">Wyszukaj</button>
          <ul>
            <li><button class="cityButton">Miasto 1</button></li>
            <li><button class="cityButton">Miasto 2</button></li>
            <li><button class="cityButton">Miasto 3</button></li>
          </ul>
        </div>
      </div>
      <ul class="favoriteCities">
        <li><button type="button" id="lodz">Łódź</button></li>
        <li><button type="button" id="nowyTarg">Nowy Targ</button></li>
        <li>
          <button type="button" id="bielskobiala">Bielsko-biała</button>
        </li>
      </ul>
    </nav>
    <main class="weatherMain">
      <div class="cityInfo">
        <h1></h1>
        <p></p>
      </div>
      <div class="weatherCard">
        <div class="cardTop">
          <div class="cardLeft">
            <h2>999&deg;</h2>
          </div>
          <div class="cardRight">
            <img class="weatherIcon" src="./media/cloud.svg" />
            <p class="weatherDescription">Przeważnie pochmurnie</p>
          </div>
        </div>
        <div class="cardBottom">
          <ul>
            <li class="feelsLike">Odczuwalna 999&deg;</li>
            <li class="highest">Najwyższa 999&deg;</li>
            <li class="lowest">Najniższa 999&deg;</li>
          </ul>
          <p class="rainProbability">lol</p>
          <p class="windSpeed"></p>
        </div>
      </div>
    </main>
    <div class="wide"></div>
    <div class="wide black"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
